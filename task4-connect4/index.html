<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4 — Pristine Light Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-window">
    <!-- Window Bar -->
    <div class="window-topbar">
      <div class="traffic-dots">
        <span class="dot close"></span>
        <span class="dot min"></span>
        <span class="dot zoom"></span>
      </div>
      <div class="window-title">Connect 4 &bull; Task 4</div>
      <div class="spacer"></div>
    </div>

    <div class="game-content">
      <!-- Status Pill -->
      <div class="turn-status-wrap">
        <div class="turn-pill" id="turnStatus">Player 1's turn (Blue)</div>
      </div>

      <!-- Scoreboard Strip -->
      <div class="score-strip">
        <div class="score-pill">
          <span class="pip p1-pip"></span>
          <span>Player 1: <strong id="p1Score">0</strong></span>
        </div>
        <div class="score-pill">
          <span>Draws: <strong id="tieScore">0</strong></span>
        </div>
        <div class="score-pill">
          <span class="pip p2-pip"></span>
          <span>Player 2: <strong id="p2Score">0</strong></span>
        </div>
      </div>

      <!-- 7x6 Matrix Board (Gravity Physics) -->
      <div class="board-frame">
        <div class="board" id="board" role="grid" aria-label="Connect 4 Grid">
          <!-- 42 slots generated by JS -->
        </div>
      </div>

      <!-- Player Dock -->
      <div class="player-dock">
        <div class="dock-card p1-dock active" id="p1Indicator">
          <div class="disc-sample p1-disc"></div>
          <span class="dock-label">Player 1 (Blue)</span>
        </div>
        <div class="dock-card p2-dock" id="p2Indicator">
          <div class="disc-sample p2-disc"></div>
          <span class="dock-label">Player 2 (Red)</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="game-actions">
        <button type="button" class="btn-restart" id="resetBtn">Restart Match</button>
        <a href="../index.html" class="back-link">&larr; Return to Suite</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
